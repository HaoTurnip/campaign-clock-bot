name = "campaign-clock-bot"
main = "src/index.ts"
compatibility_date = "2025-01-15"

# Cron Trigger fires every minute (UTC). The Worker itself decides whether the
# configured local post-time has arrived and today's bulletin hasn't run yet.
[triggers]
crons = ["* * * * *"]

# D1 database binding. Create it once with:
#   wrangler d1 create campaign_clock
# then paste the returned database_id below. Tables are created automatically by
# ensureSchema() on first request — no manual migration step.
[[d1_databases]]
binding = "DB"
database_name = "campaign_clock"
database_id = "3ae25a53-f4e4-431e-9334-df59030dcd04"

# Public, non-secret vars. Secrets (DISCORD_TOKEN, DISCORD_PUBLIC_KEY,
# DISCORD_APPLICATION_ID, REGISTER_SECRET, and optionally DISCORD_GUILD_ID) are set
# with `wrangler secret put <NAME>` and must never be committed.
[vars]
# DISCORD_GUILD_ID can be set here (non-secret) for fast guild-scoped command
# registration during development. Leave empty to register commands globally.
DISCORD_GUILD_ID = "1132359797644210338"
